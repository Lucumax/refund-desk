<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title></title><link rel="stylesheet" href="/app.css"></head>
<body data-title="demo.title">
<div class="banners" id="banners"></div>
<header><span class="brand" data-s="app.name"></span>
  <nav><a href="/inbox.html" data-s="nav.inbox"></a><a href="/buyer.html" data-s="nav.buyer"></a></nav></header>
<main>
  <section id="login" hidden>
    <h1 data-s="login.title"></h1>
    <form id="login-form">
      <label for="passcode" data-s="login.label"></label>
      <input id="passcode" name="passcode" type="password" autocomplete="current-password" required>
      <div class="actions"><button type="submit" data-s="login.button"></button></div>
    </form>
    <p id="login-msg" role="alert"></p>
  </section>
  <section id="app" hidden>
    <h1 data-s="demo.title"></h1>
    <p data-s="demo.intro"></p>
    <ul class="plain" id="scenes"></ul>
    <div class="actions">
      <button type="button" class="secondary" id="webhook" data-s="demo.webhook"></button>
      <button type="button" class="secondary" id="replay" data-s="demo.webhook_replay"></button>
      <button type="button" class="secondary" id="poll" data-s="demo.poll"></button>
      <button type="button" class="secondary" id="counts" data-s="demo.counts"></button>
      <button type="button" class="secondary" id="tamper" data-s="demo.tamper"></button>
    </div>
    <h2 data-s="demo.links_title"></h2>
    <ul class="plain" id="links"></ul>
    <h2 data-s="demo.result_title"></h2>
    <div class="result" id="result" role="status" aria-live="polite"></div>
    <p><a class="button secondary" href="/inbox.html" data-s="demo.latest"></a></p>
  </section>
</main>
<script src="/common.js"></script><script src="/demo.js"></script>
</body></html>
